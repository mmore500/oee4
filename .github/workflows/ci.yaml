name: CI
on:
  push:
    branches: [ master, main, dev, tex ]
  pull_request:
    branches:
      - '**'
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
jobs:

  latex:
    name: Latex Build
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/mmore500/teximage:sha-77b8179
      options: --user root
    steps:
      - name: Checkout paper branch (build scaffolding + binder figure submodules)
        uses: actions/checkout@v3
        with:
          ref: paper
          submodules: recursive
      - name: Drop pinned tex submodule
        run: |
          git submodule deinit -f tex
          rm -rf tex .git/modules/tex
      - name: Checkout tex content under test in its place
        uses: actions/checkout@v3
        with:
          path: tex
      - name: Build LaTeX document
        run: |
          trap 'cat *.log || true >> "$GITHUB_OUTPUT"' EXIT
          make
      - name: Upload PDF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oee4-draft-pdf
          path: oee4-draft.pdf
          if-no-files-found: warn
