name: CI
on:
  push:
    branches: [ master, main, dev, tex ]
  pull_request:
    branches:
      - '**'
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
jobs:

  latex:
    name: Latex Build
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/mmore500/teximage:sha-77b8179
      options: --user root
    steps:
      - uses: actions/checkout@v3
      - name: Fetch binder figure outputs as sibling checkouts
        run: |
          mkdir -p ../binder
          while read -r dir branch; do
            [ -z "$dir" ] && continue
            git clone --quiet --depth 1 --branch "$branch" \
              "https://github.com/${GITHUB_REPOSITORY}.git" "../binder/$dir" &
          done < .github/binder-submodules.txt
          wait
      - name: Build LaTeX document
        run: |
          trap 'cat *.log || true >> "$GITHUB_OUTPUT"' EXIT
          make
      - name: Upload PDF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oee4-draft-pdf
          path: oee4-draft.pdf
          if-no-files-found: warn
